<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latest Properties</title>
    <meta name="description" content="Curated property listings, refreshed minute by minute.">
    <meta name="theme-color" content="#1c1a16" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#12110e" media="(prefers-color-scheme: dark)">
    <meta name="referrer" content="no-referrer">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Latest Props">
    <script>
        (function () {
            try {
                var t = sessionStorage.getItem('theme');
                if (t === null) {
                    t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : '';
                }
                if (t === 'dark') {
                    document.documentElement.setAttribute('data-theme', 'dark');
                }
            } catch (e) {}
        })();
    </script>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231c1a16'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' fill='%23b78b3e' font-family='Georgia'%3ELP%3C/text%3E%3C/svg%3E">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="preconnect" href="https://images.weserv.nl" crossorigin>
    <link rel="dns-prefetch" href="https://images.weserv.nl">
<link rel="stylesheet" href="css/styles.css?v=1ebae990">
    <noscript>
        <style>.noscript{position:fixed;inset:0;z-index:5000;display:grid;place-items:center;background:#f6f4ef;color:#1c1a16;font-family:Inter,-apple-system,'Segoe UI',sans-serif;text-align:center;padding:2rem}.noscript-box{max-width:420px}.noscript h1{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:1.4rem;margin-bottom:.6rem}.noscript p{color:#79736a;font-size:.92rem;line-height:1.6}</style>
        <div class="noscript"><div class="noscript-box"><h1>JavaScript required</h1><p>This property portal needs JavaScript to display listings. Please enable it or switch to a modern browser to continue.</p></div></div>
    </noscript>
</head>
<body>

    <!-- Login -->
    <div class="login-screen" id="loginScreen">
        <div class="login-card">
            <div class="login-monogram"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m21 2-9.6 9.6"/><circle cx="7.5" cy="15.5" r="5.5"/><path d="m15.5 7.5 3 3 3.5-3.5-3-3"/></svg></div>
            <h1 class="login-title" data-i18n="accessRequired">Access Required</h1>
            <p class="login-subtitle" data-i18n="loginSubtitle">Enter your password to continue</p>
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="login-group">
                    <svg class="login-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                    <input type="password" class="login-input" id="passwordInput" placeholder="Password" data-i18n-ph="password" autofocus autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary btn-login" data-i18n="continue">Continue</button>
            </form>
            <p class="login-error" id="loginError"></p>
        </div>
    </div>

    <!-- Header -->
    <header class="header" id="header">
        <div class="header-content">
            <a href="./" class="brand" aria-label="Latest Properties">
                <span class="brand-mark">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h5.5v-5h3v5H19V9.5"/></svg>
                </span>
                <span class="brand-name" data-i18n="appTitle">Latest Properties</span>
            </a>

            <div class="header-actions">
                <div class="sort-menu-wrap">
                    <button class="btn btn-outline btn-sort" id="sortMenuBtn" onclick="toggleSortMenu()" data-i18n-aria="sortAria" aria-haspopup="true" aria-expanded="false" aria-controls="sortMenu">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5h10"/><path d="M11 9h7"/><path d="M11 13h4"/><path d="m3 17 3 3 3-3"/><path d="M6 18V4"/></svg>
                        <span class="btn-label btn-sort-label" id="sortLabel">Newest first</span>
                    </button>
                    <div class="sort-menu" id="sortMenu" hidden>
                        <button type="button" class="sort-menu-item" data-sort="date_crawled" onclick="setSort(this.dataset.sort)">
                            <span data-i18n="sortNewest">Newest first</span><span class="sort-check">✓</span>
                        </button>
                        <button type="button" class="sort-menu-item" data-sort="price_asc" onclick="setSort(this.dataset.sort)">
                            <span data-i18n="sortPriceAsc">Price: low → high</span><span class="sort-check">✓</span>
                        </button>
                        <button type="button" class="sort-menu-item" data-sort="price_desc" onclick="setSort(this.dataset.sort)">
                            <span data-i18n="sortPriceDesc">Price: high → low</span><span class="sort-check">✓</span>
                        </button>
                        <button type="button" class="sort-menu-item" data-sort="sqft_desc" onclick="setSort(this.dataset.sort)">
                            <span data-i18n="sortSize">Size: largest</span><span class="sort-check">✓</span>
                        </button>
                        <button type="button" class="sort-menu-item" data-sort="price_per_sqft_asc" onclick="setSort(this.dataset.sort)">
                            <span data-i18n="sortValue">Price / sqft: best value</span><span class="sort-check">✓</span>
                        </button>
                    </div>
                </div>
                <button class="btn btn-outline btn-filters-nav" id="filtersNavBtn" onclick="toggleSidebarMobile(this)" aria-expanded="false" aria-controls="sidebar">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3Z"/></svg>
                    <span class="btn-label" data-i18n="filters">Filters</span>
                    <span class="btn-badge" id="filterBadge" hidden></span>
                </button>
                <button class="btn btn-outline btn-icon btn-lang" id="langBtn" onclick="toggleLang()"
                        title="Switch language" data-i18n-aria="langAria">
                    EN
                </button>
                <button class="btn btn-outline btn-icon btn-theme" id="themeBtn" onclick="toggleTheme()"
                        data-i18n-aria="toggleDark" title="Toggle dark mode">
                    <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
                </button>
                <button class="btn btn-outline btn-export" id="exportBtn" onclick="exportCSV()" data-i18n-title="exportTitle">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
                    <span class="btn-label" data-i18n="export">Export</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main -->
    <main class="main">

        <!-- Filters -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-head">
                <span class="sidebar-title" data-i18n="filters">Filters</span>
                <button class="btn btn-ghost btn-icon sidebar-close" onclick="closeMobileSidebar()" data-i18n-aria="close" aria-label="Close">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                </button>
            </div>
            <div class="filter-section">
                <label class="filter-label" for="searchInput" data-i18n="search">Search</label>
                <div class="search-wrap">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
                    <input type="text" class="search-input" id="searchInput" placeholder="District, estate, address…" data-i18n-ph="searchPh" autocomplete="off">
                    <button class="search-clear" id="searchClear" aria-label="Clear search" hidden>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                    </button>
                </div>
            </div>

            <div class="filter-section">
                <label class="filter-label" data-i18n="priceRange">Price range (HK$)</label>
                <div class="price-inputs">
                    <input type="number" class="price-input" id="minPrice" placeholder="Min" data-i18n-ph="min" min="0" step="1">
                    <span class="price-sep">→</span>
                    <input type="number" class="price-input" id="maxPrice" placeholder="Max" data-i18n-ph="max" min="0" step="1">
                </div>
            </div>

            <div class="filter-section">
                <label class="filter-label" for="bedroomFilter" data-i18n="bedrooms">Bedrooms</label>
                <div class="select-wrap">
                    <select class="filter-select" id="bedroomFilter">
                        <option value="" data-i18n="any">Any</option>
                        <option value="0" data-i18n="studio">Studio</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4" data-i18n="bed4plus">4+</option>
                    </select>
                </div>
            </div>

            <div class="filter-section">
                <label class="filter-label" for="txFilter" data-i18n="transactionType">Transaction</label>
                <div class="select-wrap">
                    <select class="filter-select" id="txFilter">
                        <option value="" data-i18n="any">Any</option>
                        <option value="buy" data-i18n="buy">Buy</option>
                        <option value="rent" data-i18n="rent">Rent</option>
                    </select>
                </div>
            </div>

            <div class="filter-section">
                <label class="filter-label" for="typeFilter" data-i18n="type">Type</label>
                <div class="select-wrap">
                    <select class="filter-select" id="typeFilter">
                        <option value="" data-i18n="allTypes">All types</option>
                        <option value="apartment" data-i18n="apartment">Apartment</option>
                        <option value="house" data-i18n="house">House</option>
                        <option value="village_house" data-i18n="villageHouse">Village House</option>
                        <option value="studio" data-i18n="studio">Studio</option>
                        <option value="penthouse" data-i18n="penthouse">Penthouse</option>
                        <option value="duplex" data-i18n="duplex">Duplex</option>
                    </select>
                </div>
            </div>

            <div class="filter-section">
                <label class="filter-label" for="sourceFilter" data-i18n="sources">Sources</label>
                <div class="select-wrap">
                    <select class="filter-select" id="sourceFilter">
                        <option value="" data-i18n="allSources">All sources</option>
                        <option value="centaline">Centaline</option>
                        <option value="midland">Midland</option>
                    </select>
                </div>
            </div>

            <div class="filter-section">
                <label class="filter-row">
                    <input type="checkbox" id="newOnlyFilter">
                    <span class="cbx"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="m5 13 4 4 10-10"/></svg></span>
                    <span data-i18n="newTodayOnly">New today only</span>
                </label>
            </div>

            <div class="sidebar-foot">
                <button class="btn btn-ghost btn-reset" onclick="resetFilters()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
                    <span data-i18n="resetFilters">Reset filters</span>
                </button>
            </div>
        </aside>
        <div class="sidebar-backdrop" id="sidebarBackdrop" hidden></div>

        <!-- Results -->
        <section class="content">
            <div class="toolbar">
                <div class="toolbar-count" id="resultsCount" data-i18n="loading">Loading…</div>
                <div class="toolbar-spacer"></div>
                <button class="btn btn-outline btn-share" id="shareBtn" onclick="copyShareLink()" data-i18n-title="shareTitle" title="Copy link to this view">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>
                    <span class="btn-label" data-i18n="share">Share</span>
                </button>
                <button class="btn btn-outline btn-toggle-sidebar" onclick="toggleSidebar()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/></svg>
                    <span data-i18n="filters">Filters</span>
                </button>
            </div>

            <div class="chip-row" id="regionChips" aria-label="Quick filters"></div>

            <div class="listings-grid" id="listingsGrid">
                <div class="loading">
                    <div class="loading-ring"></div>
                    <span data-i18n="loadingListings">Loading listings…</span>
                </div>
            </div>

            <div class="pagination" id="pagination"></div>
        </section>
    </main>

    <div class="toast" id="toast">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5"/><path d="M12 16h.01"/></svg>
        <span id="toastMsg"></span>
    </div>

    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
        <button class="lightbox-btn lightbox-close" id="lightboxCloseBtn" onclick="closeLightbox()" data-i18n-aria="close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
        <button class="lightbox-btn lightbox-prev" id="lightboxPrev" onclick="lightboxStep(-1)" data-i18n-aria="prevImage"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
        <figure class="lightbox-stage">
            <img id="lightboxImg" alt="" referrerpolicy="no-referrer">
            <figcaption id="lightboxCaption"></figcaption>
        </figure>
        <button class="lightbox-btn lightbox-next" id="lightboxNext" onclick="lightboxStep(1)" data-i18n-aria="nextImage"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
    </div>

<script src="js/config.js?v=1ebae990" defer></script>
    <script src="js/app.js?v=1ebae990" defer></script>
</body>
</html>
