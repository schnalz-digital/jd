name: Probe Squarefoot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install -q curl_cffi playwright playwright-stealth camoufox

      - name: Provision browsers
        run: |
          python -m playwright install chromium
          python -m camoufox fetch

      - name: Probe
        run: python tools/probe_squarefoot.py || true

      - name: Probe with browsers
        run: python tools/probe_squarefoot_browser.py || true